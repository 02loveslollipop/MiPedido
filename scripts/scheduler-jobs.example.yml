# Example scheduler jobs YAML
# frequency values: daily | hourly | ten_minutes
# use `at: "HH:MM"` for daily to specify UTC time
# commands must match the binary names built by each image's Dockerfile
-
  command: "./ratingCronJob"
  frequency: daily
  at: "02:00"
-
  command: "./redisIndexerCronJob"
  frequency: hourly
  every: 3
