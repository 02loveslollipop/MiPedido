name: CI/CD — Build & Deploy to Heroku (Container Registry)

on:
  push:
    branches: [ main ]

# Serialize deploys: overlapping runs (e.g. rapid consecutive merges) raced on
# the same app images and transiently failed the one-off dyno checks
concurrency:
  group: deploy-to-heroku
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: dockerfile
            process: web
            smoke_check: true
            health_path: /health
            ensure_dyno: true
          - service: websocket
            context: webSocketEngine
            dockerfile: DockerFile
            process: web
            smoke_check: true
            health_path: /
            ensure_dyno: true
          # Cron services are one-shot binaries executed by Heroku Scheduler one-off
          # dynos. They are released as the `web` process type so one-off dynos run
          # this image; no dynos are scaled on those apps.
          - service: redis-indexer
            context: redisIndexerCronJob
            dockerfile: Dockerfile
            process: web
            smoke_check: false
            binary: redisIndexerCronJob
            ensure_dyno: false
          - service: rating-cron
            context: ratingCronJob
            dockerfile: Dockerfile
            process: web
            smoke_check: false
            binary: ratingCronJob
            ensure_dyno: false
    steps:
      - uses: actions/checkout@v4

      - name: Set HEROKU_APP env from secrets
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then echo "HEROKU_APP=${{ secrets.HEROKU_APP_BACKEND }}" >> $GITHUB_ENV; fi
          if [ "${{ matrix.service }}" = "websocket" ]; then echo "HEROKU_APP=${{ secrets.HEROKU_APP_WS }}" >> $GITHUB_ENV; fi
          if [ "${{ matrix.service }}" = "redis-indexer" ]; then echo "HEROKU_APP=${{ secrets.HEROKU_APP_REDIS_INDEXER }}" >> $GITHUB_ENV; fi
          if [ "${{ matrix.service }}" = "rating-cron" ]; then echo "HEROKU_APP=${{ secrets.HEROKU_APP_RATING_CRON }}" >> $GITHUB_ENV; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Heroku Container Registry
        run: echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build and push Docker image to Heroku
        run: |
          IMAGE=registry.heroku.com/${HEROKU_APP}/${{ matrix.process }}
          docker build -t $IMAGE -f ${{ matrix.context }}/${{ matrix.dockerfile }} ${{ matrix.context }}
          docker push $IMAGE

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Release image on Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:release ${{ matrix.process }} --app $HEROKU_APP

      - name: Ensure web dyno is running
        if: ${{ matrix.ensure_dyno }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          # container:release does not turn on a dyno when the formation is empty
          # (e.g. first deploy); idempotent for existing formations.
          heroku ps:scale web=1:basic --app $HEROKU_APP

      - name: Post-deploy smoke check
        if: ${{ matrix.smoke_check }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          # Default domains have random suffixes; never guess <app>.herokuapp.com
          BASE_URL="$(heroku apps:info --app "$HEROKU_APP" --json | jq -r '.app.web_url' | sed 's:/$::')"
          URL="${BASE_URL}${{ matrix.health_path }}"
          # Dynos take a while to boot after container:release; retry for up to ~2 min
          for i in $(seq 1 12); do
            echo "Attempt $i: checking $URL"
            if curl -fsS -m 10 "$URL"; then echo "Smoke test passed"; exit 0; fi
            sleep 10
          done
          echo "Smoke test failed after 12 attempts" && exit 1

      - name: One-off dyno check for cron binaries
        if: ${{ !matrix.smoke_check }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          # Verify the released image actually contains the binary the Scheduler job runs
          heroku run --exit-code --app $HEROKU_APP "test -f ./${{ matrix.binary }} && echo 'Binary present: ${{ matrix.binary }}'"

  create-scheduler-jobs:
    name: Create Heroku Scheduler entries (post-deploy)
    runs-on: ubuntu-latest
    needs: build-and-deploy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install script deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Create rating-cron Scheduler entries
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_RATING_CRON: ${{ secrets.HEROKU_APP_RATING_CRON }}
        run: |
          if [ -z "$HEROKU_APP_RATING_CRON" ]; then echo "HEROKU_APP_RATING_CRON not set, skipping"; exit 0; fi
          python scripts/create_heroku_scheduler_jobs.py --app "$HEROKU_APP_RATING_CRON" --jobs-file scripts/scheduler-jobs.rating-cron.yml

      - name: Create redis-indexer Scheduler entries
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_REDIS_INDEXER: ${{ secrets.HEROKU_APP_REDIS_INDEXER }}
        run: |
          if [ -z "$HEROKU_APP_REDIS_INDEXER" ]; then echo "HEROKU_APP_REDIS_INDEXER not set, skipping"; exit 0; fi
          python scripts/create_heroku_scheduler_jobs.py --app "$HEROKU_APP_REDIS_INDEXER" --jobs-file scripts/scheduler-jobs.redis-indexer.yml

      - name: "Reminder: manual steps if automation failed"
        run: |
          echo "If jobs could not be created programmatically, open the Scheduler dashboard:"
          echo "  heroku addons:open scheduler --app <YOUR_APP>"
