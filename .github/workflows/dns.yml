name: DNS — FlareForm reconcile

on:
  push:
    branches: [main]
    paths:
      - flareform.yaml
      - .github/workflows/dns.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flareform-production
  cancel-in-progress: false

jobs:
  dns:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: 02loveslollipop/flareform/github-action@ce8d7005b5a089d9c5d704420564b3dd1f4668a9
        with:
          operation: apply
          manifest: flareform.yaml
